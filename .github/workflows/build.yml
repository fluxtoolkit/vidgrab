name: Build VidGrab APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. JDK 17 (required by AGP 8.7) ───────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. Python 3.10 (required by Chaquopy build) ───────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── 4. Download FFmpeg binaries ────────────────────────
      #    Downloaded in CI instead of committing 200MB to git
      - name: Download FFmpeg for arm64-v8a
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L -o ffmpeg-arm64.zip \
            "https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-arm64.zip"
          unzip -o ffmpeg-arm64.zip -d _tmp_arm64
          cp _tmp_arm64/ffmpeg app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          cp _tmp_arm64/ffmpeg app/src/main/jniLibs/arm64-v8a/libffprobe.so
          chmod +x app/src/main/jniLibs/arm64-v8a/lib*.so
          rm -rf _tmp_arm64 ffmpeg-arm64.zip

      - name: Download FFmpeg for x86_64
        run: |
          mkdir -p app/src/main/jniLibs/x86_64
          curl -L -o ffmpeg-x64.zip \
            "https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-x64.zip"
          unzip -o ffmpeg-x64.zip -d _tmp_x64
          cp _tmp_x64/ffmpeg app/src/main/jniLibs/x86_64/libffmpeg.so
          cp _tmp_x64/ffmpeg app/src/main/jniLibs/x86_64/libffprobe.so
          chmod +x app/src/main/jniLibs/x86_64/lib*.so
          rm -rf _tmp_x64 ffmpeg-x64.zip

      # ── 5. Setup Gradle ───────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ── 6. Point Chaquopy to CI Python ─────────────────────
      #    Override buildPython to use the actions/setup-python path
      - name: Configure buildPython for CI
        run: |
          PYTHON_PATH=$(which python3)
          echo "Using Python at: $PYTHON_PATH"
          python3 --version
          sed -i "s|buildPython(\"/usr/bin/python3\")|buildPython(\"$PYTHON_PATH\")|g" \
            app/build.gradle.kts

      # ── 7. Build debug APK ────────────────────────────────
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # ── 8. Upload APK artifact ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VidGrab-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
